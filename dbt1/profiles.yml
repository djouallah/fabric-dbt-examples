aemo_electricity:
  target: duckrun
  outputs:
    duckrun:
      type: duckrun
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      root_path: "{{ env_var('ONELAKE_TABLES_PATH') }}"
      threads: "{{ env_var('DBT_THREADS', '4') | int(4) }}"

    iceberg:
      type: duckdb
      path: ':memory:'
      database: onelake
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      threads: 2
      settings:
        preserve_insertion_order: false
      # Credential vending covers the Tables/ section only -- Files/, the landing zone every
      # model reads, needs this.
      secrets:
        - type: azure
          name: onelake_storage
          provider: access_token
          access_token: "{{ env_var('ONELAKE_TOKEN') }}"
      attach:
        - path: "{{ env_var('WAREHOUSE_PATH') }}"
          alias: onelake
          type: iceberg
          options:
            endpoint: "{{ env_var('ONELAKE_ENDPOINT') }}"
            token: "{{ env_var('ONELAKE_TOKEN') }}"
            stage_create_tables: 0
            skip_create_table_metadata_updates: 1
            default_schema: dbo

    ducklake:
      type: duckdb
      path: ':memory:'
      database: ducklake
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      threads: "{{ env_var('DBT_THREADS', '4') | int(4) }}"
      settings:
        preserve_insertion_order: false
        mssql_query_timeout: 600
        mssql_metadata_timeout: 600
        mssql_connection_timeout: 120
      secrets:
        - type: azure
          name: onelake_storage
          provider: access_token
          access_token: "{{ env_var('ONELAKE_TOKEN') }}"
      extensions:
        - name: mssql
          repo: community
        - name: mssql_ducklake
          repo: community
        - name: delta_export
          repo: community
      attach:
        - path: "ducklake:mssql:{{ env_var('DUCKLAKE_CATALOG_DSN') }}"
          alias: ducklake
          options:
            data_path: "{{ env_var('DUCKLAKE_DATA_PATH', env_var('FILES_PATH', '/tmp') ~ '/Tables') }}"
            data_inlining_row_limit: 0
            metadata_catalog: "__ducklake_metadata_ducklake"
            meta_access_token: "{{ env_var('DBT_ENV_SECRET_SQL_TOKEN', '') }}"

    spark:
      type: spark
      method: session
      host: localhost
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      threads: 1

    polars:
      type: polars
      database: onelake
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      threads: 1
      catalogs:
        - name: onelake
          type: iceberg
          schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
          pyiceberg_type: rest
          uri: "{{ env_var('ONELAKE_ENDPOINT') }}"
          warehouse: "{{ env_var('WAREHOUSE_PATH') }}"
          adls.account-name: onelake
          adls.account-host: onelake.blob.fabric.microsoft.com
          token: "{{ env_var('ONELAKE_TOKEN') }}"
          adls.token: "{{ env_var('ONELAKE_TOKEN') }}"
        - name: landing
          type: azure
          schema: Files
          account_name: onelake
          container: "{{ env_var('POLARS_LANDING_CONTAINER') }}"
          prefix: "{{ env_var('POLARS_LANDING_ITEM') }}"
          credentials:
            storage_options:
              account_name: onelake
              bearer_token: "{{ env_var('ONELAKE_TOKEN') }}"
              use_fabric_endpoint: "true"
