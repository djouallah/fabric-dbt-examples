version: 2

# The polars engine's landing zone, read through dbt-polars' `landing` catalog (azure, over
# OneLake -- see dbt1/profiles.yml and AGENTS.md). Every other engine reads these files with
# its own reader; dbt-polars reads files only as sources.
#
# The CSV folders are read whole, as `*.CSV`, padded to 131 String columns: see
# macros/polars_read_csv.sql. The fact models narrow each to the files they picked with a
# `filename IN (...)` filter. An identifier that keeps its `.CSV` needs dbt-polars#29, and the
# padded `schema` the fork's dtype-name fix -- requirements/polars.txt pins both.
#
# `missing_columns: insert` is Polars 2's spelling of "pad the short rows": without it a
# schema wider than the first line is an error.
#
# `database` is the polars catalog name on polars and EMPTY on every other target: these
# sources are gated off there, but dbt still builds their relations at parse, and dbt-spark
# refuses any relation with a database ("Cannot set database in spark!").
#
# GENERATED SHAPE: the `schema` maps are 131 identical entries; regenerate rather than edit.

sources:
  - name: polars_landing
    description: The archive log download_aemo.py writes, read by stg_csv_archive_log.
    database: "{{ 'landing' if target.type == 'polars' else '' }}"
    schema: Files
    tables:
      - name: archive_log
        identifier: csv_raw_archive_log
        config:
          file_format: parquet

