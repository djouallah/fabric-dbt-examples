version: 2

# The polars engine's landing zone, read through dbt-polars' `landing` catalog (azure, over
# OneLake -- see dbt1/profiles.yml and AGENTS.md). Every other engine reads these files with
# its own reader; dbt-polars reads files only as sources.
#
# The landed AEMO CSV folders are NOT sources: the fact models read them with Polars SQL
# read_csv() (macros/polars_read_csv.sql). An identifier that keeps its extension needs
# dbt-polars#29, which requirements/polars.txt pins.
#
# `database` is the polars catalog name on polars and EMPTY on every other target: these
# sources are gated off there, but dbt still builds their relations at parse, and dbt-spark
# refuses any relation with a database ("Cannot set database in spark!").

sources:
  - name: polars_landing
    description: The archive log download_aemo.py writes, read by stg_csv_archive_log.
    database: "{{ 'landing' if target.type == 'polars' else '' }}"
    schema: Files
    tables:
      - name: archive_log
        identifier: csv_raw_archive_log
        config:
          file_format: parquet

  - name: polars_duid
    description: The reference CSVs dim_duid reads. They have headers.
    database: "{{ 'landing' if target.type == 'polars' else '' }}"
    schema: Files/csv_raw/duid
    tables:
      - name: duid_data
        identifier: duid_data.csv
        config: {file_format: csv}
      - name: facilities
        identifier: facilities.csv
        config: {file_format: csv}
      - name: wa_energy
        identifier: WA_ENERGY.csv
        config: {file_format: csv}
      - name: geo_data
        identifier: geo_data.csv
        config: {file_format: csv}
