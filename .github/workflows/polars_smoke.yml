name: polars smoke (candidate engine)

# A FEASIBILITY PROBE, NOT A LEG. It builds nothing this repo depends on, it is not in
# pipeline.yml, and it never gates anything — `continue-on-error: true` and the script exits 0
# whatever it finds, because a red result is the point: it becomes the upstream bug report.
#
# THE QUESTION. docs/candidate-engines.md said Polars had no dbt adapter. dbt-polars
# (datamindedbe/incubator-dbt-polars) is now on PyPI, on dbt-core 1.x, with an Iceberg catalog
# over pyiceberg. This job runs it for real: a throwaway dbt project of SQL models (never a
# Python model — the gold layer is SQL on every engine) against the same OneLake Iceberg REST
# catalog and the same landed AEMO files the iceberg leg uses. Each probe is one thing a model
# in dbt1/ does.
#
# workflow_dispatch ONLY. No push trigger, no call from pipeline.yml: it touches Fabric, so it
# costs capacity, and it should cost it only when somebody asks.
#
# NOTHING IN THE FIVE-ENGINE LAYOUT IS TOUCHED by this job, and it PROVISIONS NOTHING. The
# shared `dbt` and `dbt_landing` lakehouses are assumed to be there already; they are resolved
# by name with one read-only Fabric GET. That also keeps a `polars` key out of provision.py's
# ENGINES, which is the five-engine contract check_gating.py and deploy.py key off.

on:
  workflow_dispatch:
    inputs:
      schema:
        description: Namespace to build the probe tables in. Deliberately outside the <engine>_landing / <engine>_mart namespace the five engines share.
        required: false
        default: polars_smoke
        type: string
      keep:
        description: Leave the probe tables behind for inspection in Fabric instead of dropping them.
        required: false
        default: false
        type: boolean
      only:
        description: all = the dbt probes, then the scale probe (fct_price's read on 10/25/50 files, peak RSS per way of executing it); dbt or scale = that half alone.
        required: false
        default: all
        type: choice
        options: [all, dbt, scale]

permissions:
  id-token: write
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # The whole job is best-effort. A failure here is a finding about dbt-polars, not a broken repo.
    continue-on-error: true
    env:
      POLARS_SMOKE_SCHEMA: ${{ inputs.schema }}
      POLARS_SMOKE_KEEP: ${{ inputs.keep && '1' || '0' }}
      POLARS_SMOKE_ONLY: ${{ inputs.only }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/polars_smoke.txt

      - run: pip install -r requirements/polars_smoke.txt

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Mint OneLake token
        # storage.azure.com, the same audience the iceberg leg hands the Iceberg REST catalog.
        # It signs the catalog calls, the Iceberg data files and the Files/ reads alike.
        run: |
          TOKEN=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "ONELAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Resolve the lakehouses
        # FABRIC_LAKEHOUSE_ID set: one lakehouse is both the Iceberg warehouse and the landing
        # zone, with the AEMO daily CSVs in Files/csv (the tpch workspace's `test` lakehouse,
        # which lakehouse_benchmark's ETL lands). Unset: the `dbt` / `dbt_landing` pair the five
        # legs use, by name. ONE GET, AND IT CREATES NOTHING. A missing `dbt` lakehouse fails
        # loudly; a missing `dbt_landing` only makes the Files probes SKIP.
        env:
          FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
        run: |
          if [ -n "$FABRIC_LAKEHOUSE_ID" ]; then
            echo "WAREHOUSE_PATH=$FABRIC_WORKSPACE_ID/$FABRIC_LAKEHOUSE_ID" >> "$GITHUB_ENV"
            echo "LANDING_ITEM=$FABRIC_LAKEHOUSE_ID" >> "$GITHUB_ENV"
            echo "CSV_DIR=Files/csv" >> "$GITHUB_ENV"
            exit 0
          fi
          T=$(az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken -o tsv)
          L=$(curl -sf -H "Authorization: Bearer $T" "https://api.fabric.microsoft.com/v1/workspaces/$FABRIC_WORKSPACE_ID/lakehouses")
          ID=$(echo "$L" | jq -r '.value[] | select(.displayName=="dbt") | .id')
          if [ -z "$ID" ]; then
            echo "::error::no lakehouse named 'dbt' in this workspace -- run a real leg first"
            exit 1
          fi
          echo "resolved dbt lakehouse: $ID"
          echo "WAREHOUSE_PATH=$FABRIC_WORKSPACE_ID/$ID" >> "$GITHUB_ENV"
          LID=$(echo "$L" | jq -r '.value[] | select(.displayName=="dbt_landing") | .id')
          if [ -n "$LID" ]; then
            echo "resolved dbt_landing lakehouse: $LID"
            echo "LANDING_ITEM=$LID" >> "$GITHUB_ENV"
          else
            echo "::warning::no lakehouse named 'dbt_landing' -- the Files probes will SKIP"
          fi

      - name: Probe dbt-polars
        timeout-minutes: 40
        run: python .github/scripts/polars_smoke.py 2>&1 | tee polars_smoke.log

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          # This log IS the deliverable — the body of an issue for dbt-polars if something
          # did not work.
          name: polars-smoke-log
          path: polars_smoke.log
          if-no-files-found: warn
